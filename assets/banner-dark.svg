    <path d="M726 82 H1136" stroke="#1A2632"/>
    <circle cx="746" cy="65" r="4" fill="#FF5F57" fill-opacity="0.9"/>
    <circle cx="762" cy="65" r="4" fill="#FEBC2E" fill-opacity="0.9"/>
    <circle cx="778" cy="65" r="4" fill="#28C840" fill-opacity="0.9"/>
    <text x="931" y="69" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#67798A">root@bytewrt</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
