  <ellipse cx="930" cy="40" rx="330" ry="220" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <g>
