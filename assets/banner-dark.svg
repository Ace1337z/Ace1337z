      <text x="183" y="260.5" text-anchor="middle" fill="#C3D2DF">C</text>
      <rect x="212" y="243" width="49" height="27" rx="13.5" fill="#0D151D" stroke="#22313E"/>
      <text x="236.5" y="260.5" text-anchor="middle" fill="#C3D2DF">Go</text>
      <rect x="269" y="243" width="73" height="27" rx="13.5" fill="#0D151D" stroke="#22313E"/>
      <text x="305.5" y="260.5" text-anchor="middle" fill="#C3D2DF">Python</text>
      <rect x="350" y="243" width="98" height="27" rx="13.5" fill="#0D151D" stroke="#22313E"/>
